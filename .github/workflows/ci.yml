name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run every exercise
        run: |
          for f in */*.js; do
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
          done
